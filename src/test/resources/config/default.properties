# Base configuration shared by every environment.
# Resolution order (last wins): default.properties -> {env}.properties -> environment variables
# (key upper-cased, '.'/'-' -> '_', e.g. BASE_URL) -> -D system properties.

base.url=https://www.saucedemo.com
api.base.url=https://jsonplaceholder.typicode.com

# chrome | firefox | edge
browser=chrome
headless=false
# local | remote
execution=local
grid.url=http://localhost:4444
window.size=1920x1080
# Extra browser arguments, comma separated (e.g. --lang=en-US,--disable-gpu)
browser.args=

# normal = wait for the load event | eager = wait for DOMContentLoaded only | none
page-load.strategy=normal

# Seconds
timeout.explicit=10
timeout.page-load=30
timeout.script=30

# all | failures | none  -- "all" = screenshot before and after every step
screenshot.mode=all
# all | failures | none  -- attach each scenario's log lines to the report
log.attach=all
# Log levels and file are set with -Dlog.level / -Dlog.console.level / -Dlog.file (see logback-test.xml)

# Applitools Eyes visual testing (scenarios tagged @visual). Checkpoints are uploaded to Applitools.
# The API key comes ONLY from the APPLITOOLS_API_KEY environment variable; without it, visual checks are skipped.
applitools.enabled=true
applitools.api-key=
applitools.app-name=Swag Labs
applitools.batch-name=E2E
# Set APPLITOOLS_BATCH_ID (e.g. the CI run id) to collect several JVMs/jobs in one batch
applitools.batch-id=
# strict (recommended) | exact (pixel-by-pixel, flaky) | layout | content | ignore_colors
applitools.match-level=strict
# Fixed viewport so baselines don't depend on the machine's screen; changing it creates new baselines
applitools.viewport=1280x800
applitools.server-url=

# Parallel scenario threads
threads=4

# Sample credentials for the saucedemo.com demo site (public test accounts)
user.standard.username=standard_user
user.locked.username=locked_out_user
user.password=secret_sauce
