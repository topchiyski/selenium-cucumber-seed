name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: Config environment (src/test/resources/config/<env>.properties)
        default: dev
      tags:
        description: Cucumber tag expression
        default: not @wip and not @known-failure
  schedule:
    - cron: "0 5 * * 1-5" # weekday mornings

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      E2E_ENV: ${{ inputs.env || 'dev' }}
      E2E_TAGS: ${{ inputs.tags || 'not @wip and not @known-failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Browsers are preinstalled on ubuntu-latest; Selenium Manager fetches matching drivers.
      - name: Run tests
        id: tests
        run: >
          ./gradlew test -PignoreFailures
          -Denv="$E2E_ENV" -Dbrowser=${{ matrix.browser }} -Dheadless=true
          "-Dcucumber.filter.tags=$E2E_TAGS"

      - name: Rerun failed scenarios
        id: rerun
        if: hashFiles('build/rerun/failed.txt') != ''
        run: ./gradlew rerunFailed -Denv="$E2E_ENV" -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-${{ matrix.browser }}
          path: |
            build/reports/allure-report/allureReport
            build/reports/cucumber
            build/reports/cucumber-rerun
            build/reports/tests
            build/logs
          retention-days: 14

      # The first run uses -PignoreFailures so the rerun and report steps always happen;
      # fail the job here if scenarios still fail after the rerun.
      - name: Fail if scenarios still fail
        if: always()
        run: |
          if [ -s build/rerun/failed.txt ] && { [ ! -f build/rerun/still-failing.txt ] || [ -s build/rerun/still-failing.txt ]; }; then
            echo "::error::Failed scenarios:"; cat build/rerun/still-failing.txt 2>/dev/null || cat build/rerun/failed.txt
            exit 1
          fi
